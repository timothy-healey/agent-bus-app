[package]
name = "agent-bus-app"
version = "0.1.0"
edition = "2021"
default-run = "agent-bus-app"

[[bin]]
name = "agent-bus-app"
path = "src/main.rs"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows).
name = "agent_bus_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
